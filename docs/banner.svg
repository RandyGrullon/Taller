<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241913"/>
      <stop offset="1" stop-color="#120d0a"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.17" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D2622F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D2622F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brillo2" cx="0.86" cy="0.2" r="0.45">
      <stop offset="0" stop-color="#7B5BD6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7B5BD6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" opacity="0.07"/>
    </pattern>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE9465"/>
      <stop offset="0.5" stop-color="#C8572D"/>
      <stop offset="1" stop-color="#8A3417"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F6E3D6"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6EE"/>
      <stop offset="1" stop-color="#F3C6A8"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A1E08" flood-opacity="0.35"/>
    </filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#fondo)"/>
  <rect width="1600" height="520" rx="30" fill="url(#puntos)"/>
  <rect width="1600" height="520" rx="30" fill="url(#brillo)"/>
  <rect width="1600" height="520" rx="30" fill="url(#brillo2)"/>

  <!-- Logo -->
  <g transform="translate(110 140) scale(0.47)" filter="url(#sombra)">
    <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#f)"/>
    <path d="M132 16h248a116 116 0 0 1 116 116v40C380 212 220 120 16 196v-64A116 116 0 0 1 132 16z" fill="url(#b)"/>
    <g filter="url(#s)">
      <rect x="216" y="196" width="60" height="214" rx="30" fill="url(#m)"/>
      <rect x="216" y="338" width="60" height="16" fill="#E7B79C" opacity="0.7"/>
      <path d="M152 140h178a16 16 0 0 1 16 16v52a16 16 0 0 1-16 16H152l-40-22v-40z" fill="url(#m)"/>
      <rect x="334" y="122" width="62" height="120" rx="20" fill="url(#m)"/>
    </g>
    <g fill="#FFE2A3">
      <path d="M392 300l12 30 30 12-30 12-12 30-12-30-30-12 30-12z"/>
      <path d="M118 304l8 20 20 8-20 8-8 20-8-20-20-8 20-8z"/>
      <path d="M420 410l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
    </g>
  </g>

  <!-- Texto -->
  <g font-family="'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif">
    <text x="400" y="242" font-size="124" font-weight="700" letter-spacing="-4" fill="url(#titulo)">Taller</text>
    <text x="404" y="298" font-size="28" font-weight="500" fill="#F0D2BE">Tu agente de IA local: código, imágenes y 3D</text>
    <text x="404" y="338" font-size="22" fill="#B2978A">con los modelos que tengas en Ollama, sin salir de tu PC</text>
    <g font-size="21" font-weight="600" fill="#F6DCCB">
      <rect x="404" y="378" width="88" height="40" rx="20" fill="#C8572D" fill-opacity="0.18" stroke="#E07A50" stroke-opacity="0.6"/>
      <text x="448" y="405" text-anchor="middle">Chat</text>
      <rect x="504" y="378" width="112" height="40" rx="20" fill="#C8572D" fill-opacity="0.18" stroke="#E07A50" stroke-opacity="0.6"/>
      <text x="560" y="405" text-anchor="middle">Agente</text>
      <rect x="628" y="378" width="116" height="40" rx="20" fill="#C8572D" fill-opacity="0.18" stroke="#E07A50" stroke-opacity="0.6"/>
      <text x="686" y="405" text-anchor="middle">Imagen</text>
      <rect x="756" y="378" width="70" height="40" rx="20" fill="#C8572D" fill-opacity="0.18" stroke="#E07A50" stroke-opacity="0.6"/>
      <text x="791" y="405" text-anchor="middle">3D</text>
      <rect x="838" y="378" width="88" height="40" rx="20" fill="#7B5BD6" fill-opacity="0.18" stroke="#A58BEA" stroke-opacity="0.6"/>
      <text x="882" y="405" text-anchor="middle">MCP</text>
    </g>
  </g>

  <!-- Ventana del agente -->
  <g transform="translate(1086 96)" filter="url(#sombra)">
    <rect width="440" height="328" rx="20" fill="#1E1814" stroke="#3B2D25"/>
    <circle cx="28" cy="28" r="7" fill="#E5604D"/>
    <circle cx="52" cy="28" r="7" fill="#E8B04A"/>
    <circle cx="76" cy="28" r="7" fill="#5DBA7D"/>
    <text x="414" y="33" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="15" fill="#8C7A6E">qwen3.5:9b · Agente</text>
    <line x1="0" y1="54" x2="440" y2="54" stroke="#3B2D25"/>
    <g font-family="'Cascadia Code', Consolas, monospace" font-size="17">
      <rect x="140" y="74" width="276" height="40" rx="14" fill="#2D241E"/>
      <text x="156" y="100" fill="#F1E3D8">Crea hola.js y pruébalo</text>
      <text x="24" y="150" fill="#5DBA7D">✓</text>
      <text x="48" y="150" fill="#C9B6A8">write_file  hola.js</text>
      <text x="24" y="184" fill="#5DBA7D">✓</text>
      <text x="48" y="184" fill="#C9B6A8">run_command node hola.js</text>
      <rect x="24" y="200" width="392" height="42" rx="10" fill="#151110"/>
      <text x="40" y="227" fill="#E9A57F">¡Hola desde Taller!</text>
      <text x="24" y="282" font-family="'Segoe UI', sans-serif" font-size="18" fill="#EDE2D8">Listo: creé hola.js y lo ejecuté.</text>
      <rect x="24" y="300" width="160" height="6" rx="3" fill="#3B2D25"/>
      <rect x="24" y="300" width="160" height="6" rx="3" fill="#E07A50"/>
    </g>
  </g>

  <!-- Chispas -->
  <g fill="#FFD796">
    <path d="M985 92l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" opacity="0.9"/>
    <path d="M1490 456l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" opacity="0.8"/>
    <path d="M960 452l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" opacity="0.55"/>
    <path d="M70 70l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" opacity="0.5"/>
  </g>
</svg>
